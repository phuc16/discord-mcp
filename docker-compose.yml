services:
  discord-mcp:
    build: .
    image: discord-mcp:latest
    init: true
    restart: on-failure:3
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
